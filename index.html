<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Floating Particles -->
    <div class="particles"></div>

    <!-- Top Badge -->
    <div class="top-bar">
        🚀 API Integration Project
    </div>

    <!-- Animated Waves -->
    <div class="waves">

        <svg class="wave wave1" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="rgba(255,255,255,0.08)"
            d="M0,224L48,208C96,192,192,160,288,154.7C384,149,480,171,576,186.7C672,203,768,213,864,197.3C960,181,1056,139,1152,128C1248,117,1344,139,1392,149.3L1440,160L1440,320L0,320Z">
            </path>
        </svg>

        <svg class="wave wave2" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="rgba(255,255,255,0.05)"
            d="M0,288L48,272C96,256,192,224,288,202.7C384,181,480,171,576,176C672,181,768,203,864,218.7C960,235,1056,245,1152,234.7C1248,224,1344,192,1392,176L1440,160L1440,320L0,320Z">
            </path>
        </svg>

        <svg class="wave wave3" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="rgba(255,255,255,0.03)"
            d="M0,160L60,170.7C120,181,240,203,360,208C480,213,600,203,720,186.7C840,171,960,149,1080,154.7C1200,160,1320,192,1380,208L1440,224L1440,320L0,320Z">
            </path>
        </svg>

    </div>

    <div class="container">

        <h1>🐙 GitHub Profile Finder</h1>

        <p class="subtitle">
            Search and discover GitHub developers instantly
        </p>

        <div class="search-box">

            <input
                type="text"
                id="username"
                placeholder="Enter GitHub Username..."
            >

            <button id="searchBtn">
                Search
            </button>

        </div>

        <div id="profile">

            <p class="welcome">
                🚀 Search for a GitHub user to view their profile
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
